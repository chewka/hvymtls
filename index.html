<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Heavy Metals Bench (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header + stage bar card on top, a 4-up grid of big orange tiles, then the open tile's workspace panel. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #1d2738;
  --muted: #5d6a7e;
  --line: #d3dbe6;
  --orange: #f2661c;
  --orange-deep: #c94a0a;
  --orange-soft: #ffe2cf;
  --on-orange: #ffffff;
  --purple: #7a4bd3;
  --purple-soft: #e7dcfb;
  --teal: #11897a;
  --teal-soft: #d3f1ec;
  --blue: #2f6fd6;
  --blue-soft: #dbe7fb;
  --amber: #b77900;
  --amber-soft: #fbedc6;
  --red: #c2332f;
  --red-soft: #f9d9d7;
  --blank: #8894a6;
  --wt: #8fcdf2;
  --h2o: #bfe3fb;
  --hno3: #f6e7a6;
  --h2o2: #dfe9f2;
  --hcl: #f3d3dc;
  --au: #f2d36b;
  --on-wt: #0d3550;
  --blank-soft: #e4e9f0;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121722; --surface: #1b2230; --ink: #e8edf5; --muted: #9aa6b9; --line: #2e3849;
    --orange: #ff7a33; --orange-deep: #ff9a5e; --orange-soft: #3d2416; --on-orange: #1a0d05;
    --purple: #a888f0; --purple-soft: #2c2346; --teal: #3cc7b4; --teal-soft: #163631;
    --blue: #7aa8ff; --blue-soft: #1c2a45; --amber: #f0b440; --amber-soft: #3a2e12; --red: #ff7a72; --red-soft: #45201f;
    --blank: #8e9bb0; --blank-soft: #283142; --wt: #2f6f96; --on-wt: #e6f5ff; --h2o: #24577a; --hno3: #6b5a1c; --h2o2: #3a4656; --hcl: #5c2f3b; --au: #7a6214; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1b2230; --ink: #e8edf5; --muted: #9aa6b9; --line: #2e3849;
  --orange: #ff7a33; --orange-deep: #ff9a5e; --orange-soft: #3d2416; --on-orange: #1a0d05;
  --purple: #a888f0; --purple-soft: #2c2346; --teal: #3cc7b4; --teal-soft: #163631;
  --blue: #7aa8ff; --blue-soft: #1c2a45; --amber: #f0b440; --amber-soft: #3a2e12; --red: #ff7a72; --red-soft: #45201f;
  --blank: #8e9bb0; --blank-soft: #283142; --wt: #2f6f96; --on-wt: #e6f5ff; --h2o: #24577a; --hno3: #6b5a1c; --h2o2: #3a4656; --hcl: #5c2f3b; --au: #7a6214; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* header */
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
@media (min-width: 900px) { header.top { flex-wrap: nowrap; align-items: center; } header.top > .row { margin-left: auto; justify-content: flex-end; flex-wrap: nowrap; } header.top h1, header.top > .row .btn, header.top .count-box label { white-space: nowrap; } }
.egg.brk { background: #3b2a20; }
.count-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.count-box input { width: 4.5em; font-family: var(--f-mono); font-size: 1.2rem; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--bg); }

/* stage bar */
.stagecard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 14px; display: grid; gap: 14px; }
.stagecard-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; }
.btn:hover { border-color: var(--orange); }
.btn.primary { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }
.btn.primary:hover { background: var(--orange-deep); border-color: var(--orange-deep); }
.btn.small { padding: 3px 10px; font-size: .82rem; }
a { color: var(--orange); }
a.btn { color: var(--orange); border-color: var(--orange); text-decoration: none; }
a.btn:hover { background: var(--orange-soft); }
.btn.clear { color: var(--muted); background: var(--bg); border-color: var(--line); font-weight: 600; }
.btn.clear:hover { color: var(--ink); border-color: var(--muted); }
.btn.clear.sure { color: var(--orange); border-color: var(--orange); }
.batches { display: grid; gap: 22px; }
.batch { display: grid; gap: 6px; min-width: 0; }
.batch-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; color: var(--muted); }
.batch-meta input { width: 3.6em; font-family: var(--f-mono); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; background: var(--bg); }
.track { position: relative; display: flex; align-items: center; padding: 10px 6px 34px; touch-action: none; user-select: none; cursor: pointer; border-radius: 12px; }
.node { position: relative; flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); transition: transform .15s; }
.node.done { background: var(--orange); border-color: var(--orange); }
.node.cur { width: 30px; height: 30px; background: var(--orange); border-color: var(--surface); box-shadow: 0 0 0 3px var(--orange), 0 4px 10px rgb(0 0 0 / .18); cursor: grab; }
.track.dragging .node.cur { cursor: grabbing; transform: scale(1.1); }
.seg { flex: 1 1 0; height: 6px; background: var(--line); border-radius: 3px; margin: 0 2px; }
.seg.done { background: var(--orange); }
.node .lbl { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font-size: .74rem; white-space: nowrap; color: var(--muted); pointer-events: none; }
.node.cur .lbl { color: var(--ink); font-weight: 700; }
.saying { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.saying b { color: var(--orange-deep); }

@media (max-width: 640px) {
  .batches { grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; gap: 14px; padding-bottom: 4px; }
  .track { flex-direction: column; align-items: flex-start; padding: 6px 0 6px 8px; height: 380px; }
  .seg { width: 6px; height: auto; margin: 2px 0 2px 6px; flex: 1 1 0; }
    .node.cur { margin-left: -6px; }
  .node.cur ~ .seg, .seg { margin-left: 6px; }
  .node .lbl { top: 50%; left: calc(100% + 10px); transform: translateY(-50%); }
  .saying { font-size: 1rem; }
}

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile.wide { grid-column: 1 / -1; aspect-ratio: auto; flex-direction: row; align-items: center; justify-content: flex-start; gap: 16px; } .tile.wide svg { width: 52px; flex: none; } }
.tile { min-width: 0; aspect-ratio: 1; max-width: 100%; border: none; border-radius: 22px; background: var(--orange); color: var(--on-orange); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; box-shadow: 0 6px 0 var(--orange-deep); transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--orange-deep); }
.tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-deep); }
.tile[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
.tile .t-name { overflow-wrap: anywhere; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.1rem, 2.1vw, 1.5rem); line-height: 1.1; }
.tile .t-sub { font-size: .82rem; opacity: .92; }
.tile svg { width: 42%; max-width: 72px; height: auto; }
.pill { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: rgb(255 255 255 / .25); }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 18px; min-width: 0; }
.placeholder { border: 2px dashed var(--orange); background: var(--orange-soft); border-radius: 16px; padding: 22px; display: grid; gap: 8px; max-width: 62ch; }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.field { display: grid; gap: 4px; }
.field input { width: 6em; font-family: var(--f-mono); font-size: 1.1rem; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.c-great { background: var(--teal-soft); color: var(--teal); }
.c-good { background: var(--blue-soft); color: var(--blue); }
.c-ok { background: var(--amber-soft); color: var(--amber); }
.c-meh { background: var(--red-soft); color: var(--red); }
.c-none { background: var(--blank-soft); color: var(--muted); }
.sizestrip { display: grid; grid-template-columns: repeat(41, 1fr); gap: 2px; min-width: 520px; padding: 10px 6px; }
.sizestrip div { height: 28px; border-radius: 4px; font-size: .62rem; display: grid; place-items: center; font-family: var(--f-mono); }
.sizestrip div.here, .sizestrip button.here { outline: 3px solid var(--ink); outline-offset: 1px; position: relative; z-index: 1; }
.scroll-x { overflow-x: auto; padding: 4px 2px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.run { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.run svg { width: 100%; max-width: 240px; height: auto; }
.run.spread { cursor: pointer; }
.run.spread .offchip { visibility: hidden; }
.run.spread.show .offchip { visibility: visible; }
.run.best { box-shadow: 0 0 0 2px #f6c80f, 0 0 18px 4px rgba(246, 200, 15, .65); border-color: #f6c80f; }
.cell.b { background: var(--wt) !important; border-color: var(--wt) !important; color: var(--on-wt) !important; }
.optpick { cursor: pointer; }
.cell.dim { opacity: .25; }
.tmpsave { width: 30px; height: 17px; border-radius: 9px; border: 0; padding: 2px; background: var(--line); cursor: pointer; align-self: center; flex: none; }
.tmpsave i { display: block; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tmpsave[aria-checked="true"] { background: #2fb36a; }
.tmpsave[aria-checked="true"] i { transform: translateX(13px); }
.cell.s.dupc, .cell.dupc { background: #ff4fa0 !important; border-color: #ff4fa0 !important; color: #fff !important; }
.optpick.on { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange); }
.cell.x { background: var(--teal) !important; border-color: var(--teal) !important; color: var(--surface) !important; }
.cfg[aria-pressed="false"] { background: var(--surface); }
.lab { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: minmax(84px, 110px) minmax(104px, 130px); gap: 8px; padding: 10px; border: 3px solid var(--ink); border-radius: 16px; background: var(--bg); max-width: 760px; }
.lab .floor { grid-column: 2 / 4; grid-row: 1; display: grid; place-items: center; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: .8rem; }
.zone { display: flex; flex-direction: column; justify-content: space-between; text-align: left; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); min-width: 0; }
.zone .zn { font-family: var(--f-display); font-weight: 600; font-size: clamp(.78rem, 2.2vw, 1rem); line-height: 1.15; overflow-wrap: anywhere; }
.zone .zc { font-size: .78rem; color: var(--muted); }
.zone.on { border-color: var(--orange); background: var(--orange-soft); }
.zone.full { border-color: var(--teal); background: var(--teal-soft); }
.z-icpms { grid-column: 1; grid-row: 1; }
.z-sink { grid-column: 4; grid-row: 1; }
.task-h { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--orange-deep); margin: 6px 0 -2px; }
.z-hood { grid-column: 1; grid-row: 2; }
.z-mw { grid-column: 2; grid-row: 2; }
.z-pc { grid-column: 3; grid-row: 2; }
.z-weigh { grid-column: 4; grid-row: 2; }
.icp { border: 2px solid var(--line); border-radius: 18px; padding: 0; margin-bottom: 14px; }
.icp.on { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange-soft); }
.icp > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; list-style: none; }
.icp > summary::-webkit-details-marker { display: none; }
.icp > summary::after { content: "▾"; color: var(--orange-deep); transition: transform .2s; }
.icp[open] > summary::after { transform: rotate(180deg); }
.icp > summary .num { margin-left: auto; font-size: 1rem; color: var(--muted); }
.icp-secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; padding: 0 18px 18px; }
.icp-sec { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; background: var(--bg); }
.icp-sec .task-h { margin: 0; font-size: .9rem; }
.icp-sec .task span { font-size: 1.05rem; }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.zlist { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.zlist.on { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange-soft); }
.task { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.task input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--orange); flex: none; }
.task input:checked + span { text-decoration: line-through; color: var(--muted); }
.pcell { width: 74px; height: 46px; border-radius: 10px; background: var(--purple-soft); color: #1d2738; display: grid; place-items: center; align-content: center; gap: 1px; font-family: var(--f-mono); font-size: .72rem; line-height: 1.1; text-align: center; }
.pcell.s { background: #fff; }
.pcell.x { background: var(--teal); color: #fff; }
.racks.full { display: flex; flex-direction: column-reverse; gap: 14px; }
[data-edit]:focus { outline: 2px solid var(--orange); background: var(--surface) !important; }
.racks.full .rack { width: max-content; }
.rackwrap { display: grid; gap: 18px; }
.rackwrap.side { grid-template-columns: repeat(3, minmax(0, auto)); align-items: end; justify-content: start; }
.rackwrap .station { min-width: 0; }
.rackwrap .racks.full { overflow-x: auto; padding: 6px; }
.racks.full .pcell, .racks.full.tt .pcell, .racks.full.tf .pcell { width: 48px; height: 38px; font-size: .58rem; border-radius: 8px; }
.rackwrap.orig .racks.full { overflow: visible; padding: 0; }
.rackwrap.orig .racks.full .rack { width: 100%; }
.rackwrap.orig .racks.full .cells { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)) !important; gap: 8px; }
.rackwrap.orig .racks.full .pcell { width: auto; height: 64px; font-size: clamp(.6rem, 1.6vw, 1rem); }
.rackwrap.orig .racks.full.tt .pcell { height: 52px; font-size: clamp(.5rem, 1.2vw, .85rem); }
.racks.full .pcell.x { background: var(--surface) !important; color: #1d2738 !important; border: 2px solid var(--line) !important; }
.seg-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg-switch button { border: 0; background: var(--surface); padding: 6px 14px; font-weight: 700; }
.seg-switch button[aria-pressed="true"] { background: var(--orange); color: var(--on-orange); }
@media (max-width: 860px) { .rackwrap.side { grid-template-columns: 1fr; } }
.racks.full .cells { gap: 6px; }
.racks.full.tf .pcell { background: var(--surface); border: 2px solid var(--line); }
.racks.full.tf .pcell.x { background: var(--teal); border-color: var(--teal); }
.racks.full.tt .pcell { background: var(--surface); border: 2px solid var(--line); }
.racks.full.tt .pcell.x { background: var(--teal); border-color: var(--teal); }
.pcell.tw, .cell.tw { box-shadow: 0 0 0 3px var(--red); }
.twice { border-left: 4px solid var(--red); background: var(--red-soft); color: var(--ink); border-radius: 0 12px 12px 0; padding: 10px 14px; max-width: 80ch; }
.pcell.hl { outline: 4px solid var(--orange); outline-offset: 1px; transform: scale(1.08); position: relative; z-index: 2; }
.pcell .short { font-size: 1.05em; }
.pcell .short b { font-size: 1.2em; }
.pcell span { font-size: .62rem; opacity: .75; }
.tip { position: fixed; z-index: 50; max-width: 260px; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: .8rem; font-family: var(--f-mono); pointer-events: none; box-shadow: 0 4px 14px rgb(0 0 0 / .25); }
[data-tip] { cursor: pointer; }
.callout { background: var(--bg); border-radius: 14px; padding: 12px 14px; max-width: 70ch; }
.ask { border-left: 4px solid var(--purple); background: var(--purple-soft); border-radius: 0 12px 12px 0; padding: 10px 14px; max-width: 70ch; }

/* visualize */
.station { display: grid; gap: 10px; }
.station-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.racks { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 14px; }
.rack { border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.rack .cells { display: grid; gap: 4px; }
.cell { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .6rem; font-family: var(--f-mono); }
.rack.teflon { background: var(--blank-soft); }
.rack.teflon .cell { background: var(--surface); border: 2px solid var(--line); }
.rack.purple { background: var(--purple); }
.rack.purple .cell { background: var(--purple-soft); color: var(--ink); }
.rack.tubes { background: var(--teal-soft); }
.rack.tubes .cell { width: 22px; height: 22px; background: var(--surface); border: 2px solid var(--line); font-size: .55rem; }
.cell.s { background: var(--orange) !important; border-color: var(--orange) !important; color: var(--on-orange) !important; }
.rack-name { font-size: .72rem; font-weight: 700; color: var(--muted); }
.rack.purple .rack-name { color: var(--purple-soft); }
.sizestrip button.rec { box-shadow: 0 0 0 2px #f5c518, 0 0 14px 4px rgb(245 197 24 / .7); position: relative; z-index: 1; }
.sizestrip button.rec sup { font-size: .7rem; line-height: 0; margin-left: 1px; }
.obars { display: grid; grid-template-columns: repeat(7, minmax(70px, 1fr)); gap: 10px; min-width: 560px; }
.ocol { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; min-height: 290px; border-radius: 10px; padding: 4px; }
.ostack { display: flex; flex-direction: column-reverse; gap: 3px; border-bottom: 2px solid var(--line); padding-bottom: 3px; min-height: 8px; }
.otot { text-align: center; min-height: 1.3em; }
.oday { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 6px; }
.oblk { border-radius: 6px; color: #fff; font-size: .72rem; line-height: 1.1; padding: 3px 6px; display: flex; justify-content: space-between; align-items: center; gap: 4px; overflow: hidden; }

  };

  addEventListener("scroll", hide, true);
})();
